<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <defs>
    <linearGradient id="esBody1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Panel Background -->
  <rect width="280" height="200" rx="16" fill="#0b0b14"/>
  <rect x="10" y="10" width="260" height="180" rx="12" fill="#141425" stroke="#2a2a48" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Empty Costume Frame Card on Left -->
  <g transform="translate(42,36)">
    <rect x="0" y="0" width="66" height="74" rx="10" fill="#0b0b14" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Hanger Hook + Silhouette -->
    <path d="M33 14 C38 14 40 19 35 22 L33 24 V28" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="33,28 14,44 52,44" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Paint Sparkle -->
    <circle cx="52" cy="18" r="3" fill="#facc15"/>
  </g>

  <!-- G-Spark Mascot (Purple rounded square, big white "G", small dark arms and legs, NO face) -->
  <g transform="translate(132,26)">
    <!-- Small Dark Stick Arms & Legs (#2e1065) -->
    <g stroke="#2e1065" stroke-width="5.5" stroke-linecap="round" fill="none">
      <!-- Left arm reaching toward costume frame with paintbrush -->
      <path d="M22 46 L4 36"/>
      <!-- Right arm on hip/waving -->
      <path d="M78 48 L94 38"/>
      <!-- Left & Right legs -->
      <path d="M36 78 L32 96"/>
      <path d="M64 78 L68 96"/>
    </g>
    <!-- Feet -->
    <ellipse cx="30" cy="98" rx="7.5" ry="4" fill="#4ade80"/>
    <ellipse cx="70" cy="98" rx="7.5" ry="4" fill="#4ade80"/>
    <!-- Hands -->
    <circle cx="3" cy="35" r="5" fill="#ffffff" stroke="#2e1065" stroke-width="2"/>
    <circle cx="95" cy="37" r="5" fill="#ffffff" stroke="#2e1065" stroke-width="2"/>
    <!-- Paintbrush in Left Hand -->
    <line x1="-8" y1="24" x2="6" y2="38" stroke="#ececf6" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-8,24 -15,17 -10,14 -4,21" fill="#4ade80"/>

    <!-- Purple Rounded Square Body -->
    <rect x="20" y="18" width="60" height="60" rx="16" fill="url(#esBody1)" stroke="#2e1065" stroke-width="3"/>
    <!-- Top Highlight Gloss -->
    <path d="M30 25 H42" stroke="#ececf6" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <!-- Big White "G" (Strictly NO face/eyes/mouth) -->
    <path d="M64 38 A16 16 0 1 0 65 58 L65 48 L52 48" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Label Text -->
  <text x="140" y="154" text-anchor="middle" fill="#ececf6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">No costumes yet</text>
  <text x="140" y="173" text-anchor="middle" fill="#a3a3c2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Paint a new frame or pick a sprite from the library</text>
</svg>
