<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <defs>
    <linearGradient id="esBody3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Panel Background -->
  <rect width="280" height="200" rx="16" fill="#0b0b14"/>
  <rect x="10" y="10" width="260" height="180" rx="12" fill="#141425" stroke="#2a2a48" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Dashed Puzzle Block Drop Target on Left -->
  <g transform="translate(28,38)">
    <!-- Ghost Block Outline with Puzzle Notch -->
    <path d="M0 8 A6 6 0 0 1 6 2 H22 L27 8 H41 L46 2 H82 A6 6 0 0 1 88 8 V32 A6 6 0 0 1 82 38 H46 L41 44 H27 L22 38 H6 A6 6 0 0 1 0 32 Z" fill="#0b0b14" stroke="#4ade80" stroke-width="2" stroke-dasharray="5 3"/>
    <!-- Curved Motion Arrow Pointing into Slot -->
    <path d="M44 68 Q44 52 58 48" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="53,44 60,48 54,54" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- G-Spark Mascot (Purple rounded square, big white "G", small dark arms and legs, NO face) -->
  <g transform="translate(136,26)">
    <!-- Small Dark Stick Arms & Legs (#2e1065) -->
    <g stroke="#2e1065" stroke-width="5.5" stroke-linecap="round" fill="none">
      <!-- Left arm pointing toward block slot -->
      <path d="M22 46 L-6 42"/>
      <!-- Right arm balanced -->
      <path d="M78 48 L94 56"/>
      <!-- Legs -->
      <path d="M36 78 L32 96"/>
      <path d="M64 78 L68 96"/>
    </g>
    <!-- Feet -->
    <ellipse cx="30" cy="98" rx="7.5" ry="4" fill="#4ade80"/>
    <ellipse cx="70" cy="98" rx="7.5" ry="4" fill="#4ade80"/>
    <!-- Hands -->
    <circle cx="-7" cy="42" r="5" fill="#ffffff" stroke="#2e1065" stroke-width="2"/>
    <circle cx="95" cy="57" r="5" fill="#ffffff" stroke="#2e1065" stroke-width="2"/>

    <!-- Purple Rounded Square Body -->
    <rect x="20" y="18" width="60" height="60" rx="16" fill="url(#esBody3)" stroke="#2e1065" stroke-width="3"/>
    <!-- Top Highlight Gloss -->
    <path d="M30 25 H42" stroke="#ececf6" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <!-- Big White "G" (Strictly NO face/eyes/mouth) -->
    <path d="M64 38 A16 16 0 1 0 65 58 L65 48 L52 48" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Label Text -->
  <text x="140" y="154" text-anchor="middle" fill="#ececf6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Drag a block here</text>
  <text x="140" y="173" text-anchor="middle" fill="#a3a3c2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Snap blocks together to wire up your sprite</text>
</svg>
