<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <defs>
    <linearGradient id="esBody2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Panel Background -->
  <rect width="280" height="200" rx="16" fill="#0b0b14"/>
  <rect x="10" y="10" width="260" height="180" rx="12" fill="#141425" stroke="#2a2a48" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Muted Waveform & Speaker Icon on Left -->
  <g transform="translate(34,42)">
    <rect x="0" y="0" width="76" height="62" rx="10" fill="#0b0b14" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Speaker Cone -->
    <polygon points="14,25 22,25 32,16 32,46 22,37 14,37" fill="#8b5cf6"/>
    <!-- Flat/Silent Dotted Wave Line -->
    <line x1="40" y1="31" x2="66" y2="31" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round"/>
    <!-- Floating Eighth Note -->
    <path d="M58 12 V24 M58 12 L66 15" stroke="#facc15" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="55" cy="24" r="3.2" fill="#facc15"/>
  </g>

  <!-- G-Spark Mascot (Purple rounded square, big white "G", small dark arms and legs, NO face) -->
  <g transform="translate(132,26)">
    <!-- Small Dark Stick Arms & Legs (#2e1065) -->
    <g stroke="#2e1065" stroke-width="5.5" stroke-linecap="round" fill="none">
      <path d="M22 48 L6 54"/>
      <path d="M78 46 L96 34"/>
      <path d="M36 78 L32 96"/>
      <path d="M64 78 L68 96"/>
    </g>
    <!-- Feet -->
    <ellipse cx="30" cy="98" rx="7.5" ry="4" fill="#4ade80"/>
    <ellipse cx="70" cy="98" rx="7.5" ry="4" fill="#4ade80"/>
    <!-- Hands -->
    <circle cx="5" cy="54" r="5" fill="#ffffff" stroke="#2e1065" stroke-width="2"/>
    <circle cx="97" cy="33" r="5" fill="#ffffff" stroke="#2e1065" stroke-width="2"/>

    <!-- Electric Synth Tuning Fork in Right Hand -->
    <path d="M97 33 L103 22 M100 14 L100 22 L106 22 L106 14" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Purple Rounded Square Body -->
    <rect x="20" y="18" width="60" height="60" rx="16" fill="url(#esBody2)" stroke="#2e1065" stroke-width="3"/>
    <!-- Top Highlight Gloss -->
    <path d="M30 25 H42" stroke="#ececf6" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <!-- Big White "G" (Strictly NO face/eyes/mouth) -->
    <path d="M64 38 A16 16 0 1 0 65 58 L65 48 L52 48" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Label Text -->
  <text x="140" y="154" text-anchor="middle" fill="#ececf6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">No sounds yet</text>
  <text x="140" y="173" text-anchor="middle" fill="#a3a3c2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Generate a synth effect or build a track in Song Maker</text>
</svg>
