<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>G-Warp Opener</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #0b0b14;
      color: #ececf6;
      font-family: Inter, sans-serif;
      width: 260px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
      color: #a855f7;
    }
    p.subtitle {
      font-size: 12px;
      color: #9ca3af;
      margin: 0 0 16px 0;
    }
    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .setting input[type="checkbox"] {
      accent-color: #8b5cf6;
      cursor: pointer;
    }
    .link-container {
      margin-bottom: 16px;
    }
    a.gwarp-link {
      color: #4ade80;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }
    a.gwarp-link:hover {
      text-decoration: underline;
    }
    footer {
      font-size: 10px;
      color: #6b7280;
      border-top: 1px solid #1f1b2e;
      padding-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>G-Warp</h1>
  <p class="subtitle">Open Scratch projects in G-Warp</p>

  <div class="setting">
    <label for="show-button-toggle">Show the button on Scratch</label>
    <input type="checkbox" id="show-button-toggle" checked>
  </div>

  <div class="link-container">
    <a href="https://creapter1.github.io/gwarp/" target="_blank" class="gwarp-link">Open G-Warp ↗</a>
  </div>

  <footer>
    Independent project. Not made by or connected to the Scratch Foundation.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
