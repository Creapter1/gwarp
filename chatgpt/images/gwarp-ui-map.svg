<circle cx="75" cy="799" r="16" fill="#6366f1"/><text x="75" y="824" class="muted tiny">Stage</text>
<rect x="48" y="875" width="54" height="54" rx="12" fill="#382468" stroke="#9f7aea"/><text x="75" y="898" class="ui bold tiny" text-anchor="middle">GWrap</text><text x="75" y="914" class="ui tiny" text-anchor="middle">AI</text>
</g>
<!-- palette -->
<text x="139" y="264" class="caption">Block Palette</text><text x="139" y="283" class="muted tiny">Drag blocks into scripts</text>
<rect x="137" y="298" width="254" height="55" rx="8" fill="#0f7499"/><text x="150" y="320" class="ui bold small">move</text><rect x="198" y="307" width="48" height="29" rx="7" fill="#e0f2fe"/><text x="222" y="327" fill="#123" font-size="14" text-anchor="middle">10</text><text x="254" y="320" class="ui small">steps</text>
<rect x="137" y="361" width="254" height="55" rx="8" fill="#0f7499"/><text x="150" y="393" class="ui bold small">turn ↻</text><rect x="208" y="369" width="48" height="29" rx="7" fill="#e0f2fe"/><text x="232" y="389" fill="#123" font-size="14" text-anchor="middle">15</text><text x="264" y="393" class="ui small">degrees</text>
<rect x="137" y="425" width="254" height="58" rx="8" fill="#854d0e"/><text x="150" y="449" class="ui bold small">when</text><text x="150" y="468" class="ui small">⚑ clicked</text>
<rect x="137" y="492" width="254" height="70" rx="8" fill="#6d28d9"/><text x="150" y="516" class="ui bold small">say</text><rect x="186" y="501" width="90" height="28" rx="6" fill="#ede9fe"/><text x="231" y="520" fill="#21123f" font-size="13" text-anchor="middle">Hello!</text><text x="150" y="545" class="ui small">for 2 seconds</text>
<rect x="137" y="572" width="254" height="70" rx="8" fill="#b45309"/><text x="150" y="595" class="ui bold small">repeat 10</text><rect x="153" y="606" width="221" height="24" rx="6" fill="#c2410c"/><text x="164" y="623" class="ui tiny">blocks go inside here</text>
<rect x="137" y="651" width="254" height="70" rx="8" fill="#0f7499"/><text x="150" y="676" class="ui bold small">go to x: 0  y: 0</text><text x="150" y="699" class="ui tiny">Use fields and dropdowns</text>
<rect x="137" y="732" width="254" height="78" rx="8" fill="#9f1239"/><text x="150" y="756" class="ui bold small">add item to list</text><rect x="150" y="768" width="220" height="28" rx="6" fill="#881337"/><text x="160" y="787" class="ui tiny">List blocks and monitors</text>
<rect x="137" y="825" width="254" height="94" rx="8" fill="#17233b" stroke="#33476c"/><text x="150" y="849" class="ui bold small">Extensions</text><text x="150" y="871" class="muted tiny">Use the +/Extensions control</text><text x="150" y="890" class="muted tiny">to add extra block categories.</text>
<!-- workspace -->
<text x="433" y="264" class="caption">Scripts Workspace</text><text x="433" y="283" class="muted tiny">Build a program by connecting blocks</text>
<g filter="url(#shadow)">
<rect x="454" y="308" width="262" height="48" rx="11" fill="#a16207"/><text x="472" y="337" class="ui bold med">⚑ when green flag clicked</text>
<rect x="454" y="358" width="242" height="46" rx="9" fill="#0e7490"/><text x="472" y="386" class="ui bold med">move 10 steps</text>
<rect x="454" y="406" width="240" height="46" rx="9" fill="#0e7490"/><text x="472" y="434" class="ui bold med">turn 15 degrees</text>
<path d="M454 456 h254 v18 q0 12 -12 12 h-14 v38 q0 12 -12 12 h-202 q-14 0 -14 -14z" fill="#b45309"/><text x="470" y="481" class="ui bold med">repeat 10</text><rect x="471" y="495" width="215" height="34" rx="7" fill="#92400e" stroke="#d97706"/><text x="485" y="517" class="ui small">move 10 steps</text>
<rect x="454" y="557" width="254" height="47" rx="9" fill="#6d28d9"/><text x="472" y="586" class="ui bold med">say Hello! for 2 sec</text>
<rect x="753" y="351" width="265" height="46" rx="9" fill="#0e7490"/><text x="771" y="379" class="ui bold med">change x by 10</text>
<rect x="753" y="399" width="265" height="46" rx="9" fill="#6d28d9"/><text x="771" y="427" class="ui bold med">switch costume to</text><text x="771" y="443" class="ui tiny">costume1</text>
</g>
<path d="M722 331 C740 331 740 330 753 330" fill="none" stroke="#8b9bbd" stroke-width="2" stroke-dasharray="4 5"/><text x="442" y="670" class="muted small">Workspace actions</text><text x="442" y="693" class="muted small">• Drag blocks to move and snap scripts together.</text><text x="442" y="716" class="muted small">• Use the top controls for pan, zoom and Clean Up.</text><text x="442" y="739" class="muted small">• Right-click an empty area for workspace actions.</text><text x="442" y="762" class="muted small">• Right-click a block for block-specific actions.</text><text x="442" y="785" class="muted small">• Input slots accept values and nested reporters.</text><rect x="441" y="824" width="631" height="94" rx="10" fill="#101629" stroke="#303a5c"/><text x="457" y="850" class="ui bold small">Important</text><text x="457" y="872" class="muted small">A known issue list includes nested-stack snapping and long-script detaching.</text><text x="457" y="892" class="muted small">Test complex drags carefully; see the UI audit for current limitations.</text>
<!-- right: stage + sprites -->
