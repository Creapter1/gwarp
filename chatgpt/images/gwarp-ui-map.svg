<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">G-Warp main UI map</title>
<desc id="desc">A source-based schematic of G-Warp Beta showing the header, editor tabs, category rail, block palette, scripts workspace, stage, sprite panel, and numbered explanations. This is an annotated UI map, not a literal screenshot.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d1b"/><stop offset="1" stop-color="#151b31"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10172a"/><stop offset="1" stop-color="#17132b"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
  <style>
    .ui{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#ecf0ff}.muted{fill:#aab4d0;font-family:Inter,Segoe UI,Arial,sans-serif}.small{font-size:13px}.tiny{font-size:11px}.med{font-size:16px}.bold{font-weight:700}.panel{fill:#11182b;stroke:#303a5c;stroke-width:1.5}.card{fill:#19213a;stroke:#364269;stroke-width:1}.caption{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#f4f6ff;font-weight:700}.tag{fill:#6d4bd2;stroke:#a78bfa;stroke-width:1.2}.tagtext{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;fill:white;font-weight:800;text-anchor:middle;dominant-baseline:middle}
  </style>
</defs>
<rect width="1600" height="1000" rx="24" fill="url(#bg)"/>
<text x="30" y="36" class="ui bold" font-size="24">G-Warp Beta — Main editor UI map</text>
<text x="30" y="59" class="muted" font-size="13">Annotated map based on app.html markup · layout may shift with window size and tabs · not a live screenshot</text>
<rect x="22" y="77" width="1556" height="895" rx="16" fill="#0c1120" stroke="#303956" filter="url(#shadow)"/>
<!-- top header -->
<rect x="23" y="78" width="1554" height="86" rx="15" fill="url(#head)"/>
<rect x="23" y="145" width="1554" height="19" fill="url(#head)"/>
<rect x="39" y="96" width="36" height="36" rx="11" fill="#6d28d9" stroke="#a78bfa"/>
<text x="57" y="120" class="ui bold" text-anchor="middle" font-size="23">G</text>
<text x="86" y="111" class="ui bold" font-size="19">G Wrapper</text><text x="86" y="132" class="muted small">Beta v15.45.0</text>
<rect x="560" y="92" width="210" height="46" rx="10" fill="#1d2742" stroke="#46547b"/><text x="579" y="111" class="muted tiny">PROJECT TITLE</text><text x="579" y="129" class="ui med">Untitled G-Warp Game</text>
<rect x="797" y="91" width="94" height="45" rx="10" fill="#14532d" stroke="#4ade80"/><text x="844" y="118" class="ui bold med" text-anchor="middle">⚑ Start</text>
<rect x="899" y="91" width="100" height="45" rx="10" fill="#25324d" stroke="#52658e"/><text x="949" y="118" class="ui bold med" text-anchor="middle">Ⅱ Pause</text>
<rect x="1007" y="91" width="92" height="45" rx="10" fill="#5c1d2c" stroke="#fb7185"/><text x="1053" y="118" class="ui bold med" text-anchor="middle">■ Stop</text>
<rect x="1444" y="91" width="115" height="46" rx="10" fill="#252342" stroke="#8b5cf6"/><text x="1501" y="119" class="ui bold med" text-anchor="middle">⋮ More</text>
