<rect x="1106" y="238" width="459" height="715" rx="10" class="panel"/>
<!-- category rail -->
<text x="75" y="260" class="muted tiny" text-anchor="middle">CATEGORIES</text>
<g class="ui small" text-anchor="middle">
<circle cx="75" cy="295" r="16" fill="#0ea5e9"/><text x="75" y="320" class="muted tiny">Motion</text>
<circle cx="75" cy="351" r="16" fill="#8b5cf6"/><text x="75" y="376" class="muted tiny">Looks</text>
<circle cx="75" cy="407" r="16" fill="#ec4899"/><text x="75" y="432" class="muted tiny">Sound</text>
<circle cx="75" cy="463" r="16" fill="#eab308"/><text x="75" y="488" class="muted tiny">Events</text>
<circle cx="75" cy="519" r="16" fill="#f97316"/><text x="75" y="544" class="muted tiny">Control</text>
<circle cx="75" cy="575" r="16" fill="#06b6d4"/><text x="75" y="600" class="muted tiny">Sensing</text>
