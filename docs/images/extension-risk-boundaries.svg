<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="315" viewBox="0 0 1120 315" role="img" aria-labelledby="title desc">
<title id="title">Extension capability and execution boundary model</title>
<desc id="desc">Extension source goes through identification, code review and capability mapping, then runs in the least-privileged supported boundary. Sensitive actions require explicit consent, and Stop or removal requires cleanup.</desc>
<defs>
  <style>
    .bg{fill:#0d1321}.node{fill:#172238;stroke:#4ade80;stroke-width:2}.purple{fill:#211f42;stroke:#a78bfa;stroke-width:2}.risk{fill:#3b202b;stroke:#fb7185;stroke-width:2}
    .label{fill:#f1f5f9;font:600 15px Arial,sans-serif}.small{fill:#cbd5e1;font:13px Arial,sans-serif}
    .arrow{stroke:#94a3b8;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .marker{fill:#94a3b8}
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1120" height="315" rx="18"/>
<text class="label" x="28" y="34" style="font-size:21px">Risk labels explain danger; execution boundaries enforce limits</text>
<rect class="node" x="28" y="74" width="155" height="94" rx="12"/>
<text class="label" x="105" y="101" text-anchor="middle">1. Identify</text>
<text class="small" x="105" y="123" text-anchor="middle">Source + licence</text>
<text class="small" x="105" y="143" text-anchor="middle">Version + hash</text>
<rect class="purple" x="220" y="74" width="180" height="94" rx="12"/>
<text class="label" x="310" y="101" text-anchor="middle">2. Review</text>
<text class="small" x="310" y="123" text-anchor="middle">Code + reachable APIs</text>
<text class="small" x="310" y="143" text-anchor="middle">Capabilities + risks</text>
<rect class="purple" x="438" y="74" width="180" height="94" rx="12"/>
<text class="label" x="528" y="101" text-anchor="middle">3. Contain</text>
<text class="small" x="528" y="123" text-anchor="middle">Least privilege</text>
<text class="small" x="528" y="143" text-anchor="middle">Sandbox or deny</text>
<rect class="risk" x="656" y="74" width="205" height="94" rx="12"/>
<text class="label" x="758" y="101" text-anchor="middle">4. Ask when needed</text>
<text class="small" x="758" y="123" text-anchor="middle">What data? Where?</text>
<text class="small" x="758" y="143" text-anchor="middle">One explicit decision</text>
<rect class="node" x="899" y="74" width="193" height="94" rx="12"/>
<text class="label" x="995" y="101" text-anchor="middle">5. Test lifecycle</text>
<text class="small" x="995" y="123" text-anchor="middle">Stop / remove / fail</text>
<text class="small" x="995" y="143" text-anchor="middle">Clean up resources</text>
<path class="arrow" d="M183 121 H214" marker-end="url(#arrow)"/>
<path class="arrow" d="M400 121 H432" marker-end="url(#arrow)"/>
<path class="arrow" d="M618 121 H650" marker-end="url(#arrow)"/>
<path class="arrow" d="M861 121 H893" marker-end="url(#arrow)"/>
<rect x="28" y="208" width="1064" height="72" rx="12" fill="#101827" stroke="#475569" stroke-width="1.4"/>
<text class="label" x="48" y="234">Hard rule</text>
<text class="small" x="48" y="255">A project’s extension declaration is not permission to fetch or execute code automatically.</text>
<text class="small" x="48" y="272">A Safe / Moderate / Dangerous badge is not a sandbox and cannot replace a capability review.</text>
</svg>