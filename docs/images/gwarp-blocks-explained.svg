<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">How Scratch-style blocks work</title><desc id="desc">Diagram explains event hat, statement blocks, C-shaped loops, reporter values, Boolean conditions, and the flow of a script.</desc>
<rect width="1200" height="650" rx="24" fill="#f7faff"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173d78">Blocks are instructions that connect</text><text x="40" y="82" font-family="Arial,sans-serif" font-size="17" fill="#51698d">Shape hints at the block's job. Connections determine how the program flows.</text>
<rect x="35" y="112" width="555" height="480" rx="18" fill="#fff" stroke="#c7d7ee" stroke-width="2"/><text x="60" y="151" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#244a85">A. A script runs from top to bottom</text>
<path d="M82 188 h290 q15 0 15 15 v28 h-15 v-10 h-275 v10 h-15z" fill="#f4bd3d"/><text x="105" y="213" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#563b00">when Green Flag clicked</text>
<rect x="82" y="232" width="290" height="48" rx="13" fill="#278ee7"/><text x="105" y="262" font-family="Arial,sans-serif" font-size="17" fill="#fff">move 10 steps</text>
<rect x="82" y="280" width="290" height="48" rx="13" fill="#9256e8"/><text x="105" y="310" font-family="Arial,sans-serif" font-size="17" fill="#fff">say Hello! for 2 seconds</text>
<path d="M82 347 h290 q15 0 15 15 v70 q0 15 -15 15 h-290 q-15 0 -15 -15 v-70 q0 -15 15 -15 M100 368 h250 v50 H100Z" fill="#f4a11c"/><text x="112" y="367" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#553400">repeat 10</text><text x="121" y="390" font-family="Arial,sans-serif" font-size="14" fill="#553400">move 10 steps</text><text x="121" y="409" font-family="Arial,sans-serif" font-size="14" fill="#553400">next costume</text>
<text x="80" y="475" font-family="Arial,sans-serif" font-size="15" fill="#425a7d">1. Event starts the stack.</text><text x="80" y="499" font-family="Arial,sans-serif" font-size="15" fill="#425a7d">2. Statements run in sequence.</text><text x="80" y="523" font-family="Arial,sans-serif" font-size="15" fill="#425a7d">3. A C-block repeats its inner steps.</text><text x="80" y="555" font-family="Arial,sans-serif" font-size="14" fill="#71829b">Illustrative blocks, not a live editor screenshot.</text>
<rect x="615" y="112" width="550" height="480" rx="18" fill="#fff" stroke="#c7d7ee" stroke-width="2"/><text x="640" y="151" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#244a85">B. Common block shapes</text>
<path d="M650 183 h210 q12 0 12 12 v22 h-12 v-8 h-198 v8 h-12z" fill="#f4bd3d"/><text x="671" y="208" font-family="Arial,sans-serif" font-size="16" fill="#563b00">Hat: starts a script</text>
<rect x="650" y="236" width="222" height="42" rx="12" fill="#278ee7"/><text x="671" y="262" font-family="Arial,sans-serif" font-size="16" fill="#fff">Statement: does an action</text>
<path d="M650 296 h220 q12 0 12 12 v50 q0 12 -12 12 H650 q-12 0 -12 -12 v-50 q0 -12 12 -12 M670 316 h176 v31 H670z" fill="#f4a11c"/><text x="672" y="313" font-family="Arial,sans-serif" font-size="14" fill="#563b00">C-block: contains steps</text>
<rect x="650" y="390" width="150" height="38" rx="19" fill="#31a85d"/><text x="670" y="414" font-family="Arial,sans-serif" font-size="15" fill="#fff">Reporter: 10</text>
<path d="M850 390 l19 -19 h100 l19 19 -19 19 H869Z" fill="#31a85d"/><text x="873" y="395" font-family="Arial,sans-serif" font-size="13" fill="#fff">Boolean?</text>
<text x="650" y="454" font-family="Arial,sans-serif" font-size="15" fill="#425a7d">Reporter: provides a value (number, text, etc.).</text><text x="650" y="478" font-family="Arial,sans-serif" font-size="15" fill="#425a7d">Boolean: answers true or false.</text><text x="650" y="502" font-family="Arial,sans-serif" font-size="15" fill="#425a7d">Inputs are sockets where values/conditions fit.</text>
<rect x="645" y="526" width="485" height="42" rx="10" fill="#e7f2ff"/><text x="663" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#244a85">Tip: connect blocks, then run a tiny test.</text>
</svg>