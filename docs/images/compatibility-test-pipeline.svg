<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
<title id="title">G-Warp compatibility testing pipeline</title>
<desc id="desc">A minimal project and defined expected result are tested against a trusted baseline and G-Warp, then their traces and project structure are compared, documented, and turned into regression tests.</desc>
<defs>
  <style>
    .bg{fill:#0d1321}.node{fill:#172238;stroke:#4ade80;stroke-width:2}.node2{fill:#211f42;stroke:#a78bfa;stroke-width:2}
    .label{fill:#f1f5f9;font:600 16px Arial,sans-serif}.small{fill:#cbd5e1;font:13px Arial,sans-serif}
    .arrow{stroke:#94a3b8;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .tag{fill:#0d1321;stroke:#64748b;stroke-width:1.2}
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1120" height="300" rx="18"/>
<text x="30" y="35" class="label" style="font-size:21px">Compatibility testing is a repeatable evidence pipeline</text>
<rect class="node" x="30" y="80" width="185" height="92" rx="12"/>
<text class="label" x="122" y="108" text-anchor="middle">1. Tiny fixture</text>
<text class="small" x="122" y="132" text-anchor="middle">One behavior only</text>
<text class="small" x="122" y="151" text-anchor="middle">Known input/state</text>
<rect class="node2" x="270" y="80" width="185" height="92" rx="12"/>
<text class="label" x="362" y="108" text-anchor="middle">2. Baseline</text>
<text class="small" x="362" y="132" text-anchor="middle">Scratch / target build</text>
<text class="small" x="362" y="151" text-anchor="middle">Record expected trace</text>
<rect class="node2" x="510" y="80" width="185" height="92" rx="12"/>
<text class="label" x="602" y="108" text-anchor="middle">3. G-Warp</text>
<text class="small" x="602" y="132" text-anchor="middle">Same fixture + inputs</text>
<text class="small" x="602" y="151" text-anchor="middle">Capture actual trace</text>
<rect class="node" x="750" y="80" width="155" height="92" rx="12"/>
<text class="label" x="827" y="108" text-anchor="middle">4. Compare</text>
<text class="small" x="827" y="132" text-anchor="middle">State + order</text>
<text class="small" x="827" y="151" text-anchor="middle">Not just pixels</text>
<rect class="node" x="960" y="80" width="130" height="92" rx="12"/>
<text class="label" x="1025" y="108" text-anchor="middle">5. Record</text>
<text class="small" x="1025" y="132" text-anchor="middle">Evidence</text>
<text class="small" x="1025" y="151" text-anchor="middle">Regression test</text>
<path class="arrow" d="M215 126 H264" marker-end="url(#arrow)"/>
<path class="arrow" d="M455 126 H504" marker-end="url(#arrow)"/>
<path class="arrow" d="M695 126 H744" marker-end="url(#arrow)"/>
<path class="arrow" d="M905 126 H954" marker-end="url(#arrow)"/>
<rect class="tag" x="30" y="215" width="1060" height="48" rx="10"/>
<text class="small" x="560" y="235" text-anchor="middle">Each record includes build SHA, browser/settings, exact steps, expected and actual results.</text>
<text class="small" x="560" y="253" text-anchor="middle">If the expected result is uncertain, stop and mark NEEDS RECHECK before changing code.</text>
</svg>