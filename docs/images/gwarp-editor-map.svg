<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">How to read the G-Warp editor</title><desc id="desc">A simplified editor map showing category rail, block palette, script workspace, Stage, sprite list, tabs, and project controls.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#e9f1ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5575a8"/></marker></defs>
<rect width="1200" height="700" rx="24" fill="url(#bg)"/>
<text x="42" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16366b">Read the G-Warp editor from left to right</text><text x="42" y="82" font-family="Arial,sans-serif" font-size="17" fill="#49638a">A learning map — simplified illustration, not a captured screenshot.</text>
<rect x="35" y="112" width="1130" height="510" rx="18" fill="#fff" stroke="#b8cbe8" stroke-width="2"/>
<rect x="52" y="128" width="1096" height="52" rx="10" fill="#123f7b"/><text x="75" y="160" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Project controls</text><text x="335" y="160" font-family="Arial,sans-serif" font-size="16" fill="#d8e8ff">Start • Stop • File actions • Tools</text>
<rect x="52" y="196" width="145" height="300" rx="12" fill="#e9f3ff" stroke="#7ca8e7" stroke-width="2"/><text x="68" y="225" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174a94">1. Categories</text>
<circle cx="73" cy="253" r="7" fill="#2d9fe8"/><text x="90" y="259" font-family="Arial,sans-serif" font-size="15" fill="#243a5b">Motion</text><circle cx="73" cy="280" r="7" fill="#9958e8"/><text x="90" y="286" font-family="Arial,sans-serif" font-size="15" fill="#243a5b">Looks</text><circle cx="73" cy="307" r="7" fill="#e64b93"/><text x="90" y="313" font-family="Arial,sans-serif" font-size="15" fill="#243a5b">Sound</text><circle cx="73" cy="334" r="7" fill="#f6ae2d"/><text x="90" y="340" font-family="Arial,sans-serif" font-size="15" fill="#243a5b">Events</text><circle cx="73" cy="361" r="7" fill="#f39a20"/><text x="90" y="367" font-family="Arial,sans-serif" font-size="15" fill="#243a5b">Control</text><circle cx="73" cy="388" r="7" fill="#1daec4"/><text x="90" y="394" font-family="Arial,sans-serif" font-size="15" fill="#243a5b">Sensing</text><circle cx="73" cy="415" r="7" fill="#29a56a"/><text x="90" y="421" font-family="Arial,sans-serif" font-size="15" fill="#243a5b">Operators</text><circle cx="73" cy="442" r="7" fill="#e9a52b"/><text x="90" y="448" font-family="Arial,sans-serif" font-size="15" fill="#243a5b">Variables</text>
<rect x="212" y="196" width="210" height="300" rx="12" fill="#fff6e5" stroke="#efbd59" stroke-width="2"/><text x="229" y="225" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#925b00">2. Block palette</text><text x="229" y="250" font-family="Arial,sans-serif" font-size="14" fill="#73572c">Pick a block to use</text><rect x="230" y="270" width="165" height="40" rx="12" fill="#278ee7"/><text x="244" y="295" font-family="Arial,sans-serif" font-size="15" fill="#fff">move 10 steps</text><rect x="230" y="323" width="165" height="40" rx="12" fill="#9256e8"/><text x="244" y="348" font-family="Arial,sans-serif" font-size="15" fill="#fff">say Hello!</text><path d="M230 382 h110 q10 0 10 10 v20 h-10 v-10 h-100 v10 h-10z" fill="#f3a31c"/><text x="244" y="401" font-family="Arial,sans-serif" font-size="14" fill="#3b2a08">repeat 10</text><text x="230" y="456" font-family="Arial,sans-serif" font-size="14" fill="#73572c">Drag blocks into the</text><text x="230" y="476" font-family="Arial,sans-serif" font-size="14" fill="#73572c">script workspace →</text>
<rect x="437" y="196" width="355" height="300" rx="12" fill="#f7f1ff" stroke="#b59ae8" stroke-width="2"/><text x="455" y="225" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5c369b">3. Script workspace</text><text x="455" y="250" font-family="Arial,sans-serif" font-size="14" fill="#685687">Connect blocks to make instructions</text><path d="M472 270 h155 q10 0 10 10 v24 h-10 v-8 h-145 v8 h-10z" fill="#f4bd3d"/><text x="485" y="291" font-family="Arial,sans-serif" font-size="14" fill="#533800">when flag clicked</text><rect x="472" y="306" width="155" height="35" rx="10" fill="#278ee7"/><text x="485" y="328" font-family="Arial,sans-serif" font-size="14" fill="#fff">move 10 steps</text><rect x="472" y="341" width="155" height="35" rx="10" fill="#9256e8"/><text x="485" y="363" font-family="Arial,sans-serif" font-size="14" fill="#fff">say Hello!</text><path d="M472 394 h145 q10 0 10 10 v38 q0 10 -10 10 h-145 q-10 0 -10 -10 v-38 q0 -10 10 -10 M482 412 h120 v20 h-120z" fill="#f4a11c"/><text x="490" y="408" font-family="Arial,sans-serif" font-size="13" fill="#4d3000">repeat 10</text><text x="490" y="428" font-family="Arial,sans-serif" font-size="12" fill="#4d3000">  move 10 steps</text><text x="455" y="473" font-family="Arial,sans-serif" font-size="14" fill="#685687">The connected stack is a script.</text>
<rect x="807" y="196" width="323" height="188" rx="12" fill="#e7fbf2" stroke="#77c9a7" stroke-width="2"/><text x="825" y="225" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#126344">4. Stage</text><rect x="825" y="243" width="287" height="123" rx="8" fill="#8de0f7"/><path d="M825 325 Q875 290 928 327 T1030 320 T1112 318 V366 H825Z" fill="#55c77d"/><path d="M825 346 Q890 324 945 350 T1050 345 T1112 340 V366 H825Z" fill="#2d9b55"/><circle cx="971" cy="299" r="19" fill="#f5a623"/><ellipse cx="971" cy="319" rx="18" ry="9" fill="#f5a623"/><circle cx="978" cy="295" r="3" fill="#17345b"/><text x="825" y="405" font-family="Arial,sans-serif" font-size="14" fill="#126344">See your project run here.</text>
<rect x="807" y="420" width="323" height="76" rx="12" fill="#f0edff" stroke="#aa9be9" stroke-width="2"/><text x="825" y="447" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5039a0">5. Sprite list</text><text x="825" y="472" font-family="Arial,sans-serif" font-size="14" fill="#594e88">Choose which character or object to edit.</text>
<rect x="52" y="512" width="1096" height="88" rx="12" fill="#edf5ff" stroke="#9dbde8" stroke-width="2"/><text x="72" y="542" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174a94">6. Code / Costumes / Sounds tabs</text><text x="72" y="570" font-family="Arial,sans-serif" font-size="15" fill="#38577f">Code changes behavior • Costumes change appearance • Sounds manages audio assets</text>
<path d="M197 345 H210" stroke="#5575a8" stroke-width="3" marker-end="url(#arrow)"/><path d="M422 345 H435" stroke="#5575a8" stroke-width="3" marker-end="url(#arrow)"/><path d="M792 300 H805" stroke="#5575a8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="42" y="660" font-family="Arial,sans-serif" font-size="14" fill="#58708f">Learning tip: choose a sprite → add an event block → attach actions → press Start → observe the Stage.</text>
</svg>