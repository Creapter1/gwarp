<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G-Warp Easing Lab — Stick Arm &amp; Shortest-Arc Pose Mixer</title>
  <style>
    :root {
      --bg: #0b0b14;
      --panel: #141425;
      --panel-2: #1b1b31;
      --line: #2a2a48;
      --text: #ececf6;
      --muted: #a3a3c2;
      --violet: #8b5cf6;
      --violet-2: #a855f7;
      --green: #4ade80;
      --gold: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      color: var(--green);
      letter-spacing: -0.01em;
    }
    .sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
    }
    button {
      background: var(--violet);
      color: #fff;
      border: 1px solid var(--violet-2);
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.12s ease;
    }
    button:hover { background: var(--violet-2); }
    button.secondary {
      background: var(--panel-2);
      border-color: var(--line);
      color: var(--text);
    }
    button.secondary.active {
      border-color: var(--green);
      color: var(--green);
    }
    label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      width: 200px;
      accent-color: var(--green);
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--green);
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 16px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .card h2 {
      font-size: 15px;
      margin: 0;
      color: var(--text);
    }
    .card .fn-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--violet-2);
      background: #0b0b14;
      padding: 2px 8px;
      border-radius: 5px;
      border: 1px solid var(--line);
    }
    canvas {
      width: 100%;
      background: #080810;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: block;
    }
    .readout {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #0b0b14;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #1b1b31;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>G-Warp Easing Lab — Stick Arm &amp; Pose Mixer</h1>
      <p class="sub">Pure functions <code>linear(t)</code>, <code>easeInOut(t)</code>, <code>spring(t)</code> + <code>mixPose(A, B, t, ease)</code> turning angles the short way round.</p>
    </div>
  </header>

  <div class="toolbar">
    <button id="playBtn" type="button">Pause</button>
    <label for="tSlider">
      Progress t = <span id="tVal" class="mono">0.50</span>
      <input id="tSlider" type="range" min="0" max="1" step="0.01" value="0.50" />
    </label>
    <label>
      Preset Pose:
      <button type="button" class="secondary active" data-preset="wave">High Wave (350° → 20° short way)</button>
      <button type="button" class="secondary" data-preset="throw">Power Throw</button>
      <button type="button" class="secondary" data-preset="reach">Uppercut Reach</button>
    </label>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-head">
        <h2>1. Linear</h2>
        <span class="fn-tag">linear(t) → t</span>
      </div>
      <canvas id="cvLinear" width="360" height="300"></canvas>
      <div class="readout" id="infoLinear"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>2. Ease In-Out</h2>
        <span class="fn-tag">easeInOut(t)</span>
      </div>
      <canvas id="cvEaseInOut" width="360" height="300"></canvas>
      <div class="readout" id="infoEaseInOut"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>3. Spring</h2>
        <span class="fn-tag">spring(t)</span>
      </div>
      <canvas id="cvSpring" width="360" height="300"></canvas>
      <div class="readout" id="infoSpring"></div>
    </div>
  </div>

  <script src="easing.js"></script>
  <script>
    (() => {
      const { linear, easeInOut, spring, mixPose } = window.GW_EASING;

      const PRESETS = {
        wave: {
          // 350 deg to 25 deg crosses 0 deg via a +35 deg shortest-way turn (not -325 deg!)
          A: { shoulder: 350, elbow: -65, wrist: -25 },
          B: { shoulder: 25, elbow: -115, wrist: 35 }
        },
        throw: {
          A: { shoulder: 215, elbow: 85, wrist: 30 },
          B: { shoulder: 335, elbow: 15, wrist: -35 }
        },
        reach: {
          A: { shoulder: 75, elbow: -40, wrist: -15 },
          B: { shoulder: 285, elbow: -95, wrist: 20 }
        }
      };

      let activePreset = 'wave';
      let playing = true;
      let curT = 0.5;

      const slider = document.getElementById('tSlider');
      const tVal = document.getElementById('tVal');
      const playBtn = document.getElementById('playBtn');

      function solveArm(pose, baseX, baseY) {
        const L1 = 62;
        const L2 = 52;
        const L3 = 26;

        const a1 = (pose.shoulder || 0) * Math.PI / 180;
        const a2 = a1 + (pose.elbow || 0) * Math.PI / 180;
        const a3 = a2 + (pose.wrist || 0) * Math.PI / 180;

        const x1 = baseX + Math.cos(a1) * L1;
        const y1 = baseY + Math.sin(a1) * L1;

        const x2 = x1 + Math.cos(a2) * L2;
        const y2 = y1 + Math.sin(a2) * L2;

        const x3 = x2 + Math.cos(a3) * L3;
        const y3 = y2 + Math.sin(a3) * L3;

        return {
          shoulder: { x: baseX, y: baseY },
          elbow: { x: x1, y: y1 },
          wrist: { x: x2, y: y2 },
          tip: { x: x3, y: y3 }
        };
      }

      function drawStickArm(ctx, joints, color, width, alpha, isMain) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Upper arm & forearm
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(joints.shoulder.x, joints.shoulder.y);
        ctx.lineTo(joints.elbow.x, joints.elbow.y);
        ctx.lineTo(joints.wrist.x, joints.wrist.y);
        ctx.stroke();

        // Hand segment
        ctx.strokeStyle = isMain ? '#facc15' : color;
        ctx.lineWidth = Math.max(2, width - 2);
        ctx.beginPath();
        ctx.moveTo(joints.wrist.x, joints.wrist.y);
        ctx.lineTo(joints.tip.x, joints.tip.y);
        ctx.stroke();

        // Joint pivots
        const pts = [
          { p: joints.shoulder, r: isMain ? 7 : 4, fill: '#8b5cf6' },
          { p: joints.elbow, r: isMain ? 5.5 : 3.5, fill: '#ececf6' },
          { p: joints.wrist, r: isMain ? 4.5 : 3, fill: '#4ade80' },
          { p: joints.tip, r: isMain ? 5 : 3, fill: '#facc15' }
        ];
        for (const j of pts) {
          ctx.fillStyle = j.fill;
          ctx.beginPath();
          ctx.arc(j.p.x, j.p.y, j.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawCard(canvasId, infoId, easeFn, t) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        const { A, B } = PRESETS[activePreset];
        const baseX = 165;
        const baseY = 128;

        // Subtle grid
        ctx.strokeStyle = '#141425';
        ctx.lineWidth = 1;
        for (let gx = 20; gx < W; gx += 28) {
          ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 210); ctx.stroke();
        }
        for (let gy = 20; gy < 210; gy += 28) {
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
        }

        // Shoulder mount pillar
        ctx.strokeStyle = '#2a2a48';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, 200);
        ctx.stroke();

        // Draw Pose A & Pose B endpoints
        drawStickArm(ctx, solveArm(A, baseX, baseY), '#6366f1', 4, 0.25, false);
        drawStickArm(ctx, solveArm(B, baseX, baseY), '#a855f7', 4, 0.25, false);

        // Onion-skin ghosts
        [0.2, 0.4, 0.6, 0.8].forEach((gt) => {
          const gPose = mixPose(A, B, gt, easeFn);
          drawStickArm(ctx, solveArm(gPose, baseX, baseY), '#8b5cf6', 3, 0.18, false);
        });

        // Tip trajectory arc
        ctx.save();
        ctx.strokeStyle = '#4ade80';
        ctx.globalAlpha = 0.4;
        ctx.setLineDash([3, 3]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const st = i / 40;
          const sp = solveArm(mixPose(A, B, st, easeFn), baseX, baseY);
          if (i === 0) ctx.moveTo(sp.tip.x, sp.tip.y);
          else ctx.lineTo(sp.tip.x, sp.tip.y);
        }
        ctx.stroke();
        ctx.restore();

        // Active mixed pose
        const mixed = mixPose(A, B, t, easeFn);
        const solved = solveArm(mixed, baseX, baseY);
        drawStickArm(ctx, solved, '#4ade80', 8, 1.0, true);

        // Easing curve graph at bottom
        const gx = 24, gy = 224, gw = W - 48, gh = 56;
        ctx.fillStyle = '#0b0b14';
        ctx.strokeStyle = '#2a2a48';
        ctx.lineWidth = 1;
        ctx.fillRect(gx, gy, gw, gh);
        ctx.strokeRect(gx, gy, gw, gh);

        ctx.beginPath();
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 2.2;
        for (let i = 0; i <= 80; i++) {
          const x = i / 80;
          const y = easeFn(x);
          const px = gx + x * gw;
          const py = gy + gh - 8 - y * (gh - 16);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        const easedT = easeFn(t);
        const dotX = gx + t * gw;
        const dotY = gy + gh - 8 - easedT * (gh - 16);
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.arc(dotX, dotY, 4.5, 0, Math.PI * 2);
        ctx.fill();

        const normSh = ((mixed.shoulder % 360) + 360) % 360;
        document.getElementById(infoId).innerHTML =
          `<span>ease(t): <strong>${easedT.toFixed(3)}</strong></span>` +
          `<span>shoulder: <strong>${normSh.toFixed(1)}°</strong></span>` +
          `<span>elbow: <strong>${mixed.elbow.toFixed(1)}°</strong></span>`;
      }

      function render() {
        tVal.textContent = curT.toFixed(2);
        slider.value = String(curT);
        drawCard('cvLinear', 'infoLinear', linear, curT);
        drawCard('cvEaseInOut', 'infoEaseInOut', easeInOut, curT);
        drawCard('cvSpring', 'infoSpring', spring, curT);
      }

      slider.addEventListener('input', () => {
        playing = false;
        playBtn.textContent = 'Play';
        curT = Number(slider.value);
        render();
      });

      playBtn.addEventListener('click', () => {
        playing = !playing;
        playBtn.textContent = playing ? 'Pause' : 'Play';
      });

      document.querySelectorAll('[data-preset]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-preset]').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          activePreset = btn.getAttribute('data-preset');
          render();
        });
      });

      function tick(now) {
        if (playing) {
          // Smooth ping-pong with brief pause at ends
          const raw = (Math.sin(now * 0.0024) + 1) / 2;
          curT = Math.max(0, Math.min(1, (raw - 0.08) / 0.84));
          render();
        }
        requestAnimationFrame(tick);
      }

      render();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
