  <g id="palette-myblocks" transform="translate(260,6)">
    <rect x="1" y="1" width="22" height="22" rx="6" fill="#141425" stroke="#a855f7" stroke-width="2"/>
    <path d="M6 9 H18 V17 H6 Z" fill="#a855f7" stroke="#ececf6" stroke-width="1.6"/>
    <path d="M9 9 V6 M15 9 V6" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round"/>
