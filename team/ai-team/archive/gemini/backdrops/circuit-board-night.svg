    <path d="M480 68 H402 L374 96 H324"/>
    <path d="M180 0 V44 L212 76 V112"/>
    <path d="M300 0 V44 L268 76 V112"/>
    <path d="M0 250 H84 L120 214 H176"/>
    <path d="M480 246 H392 L356 210 H304"/>
    <path d="M140 360 V302 L182 260 H216"/>
