    <polygon points="246,140 220,178 242,178 232,212 262,172 240,172" fill="#4ade80" stroke="#ececf6" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Solder Pads / Via Nodes -->
  <g fill="#0b0b14" stroke="#4ade80" stroke-width="2.5">
    <circle cx="92" cy="144" r="4.5"/>
    <circle cx="388" cy="144" r="4.5"/>
    <circle cx="150" cy="166" r="4.5"/>
    <circle cx="330" cy="166" r="4.5"/>
    <circle cx="112" cy="240" r="4.5"/>
    <circle cx="368" cy="240" r="4.5"/>
