    <rect x="394" y="92" width="52" height="34" rx="5"/>
    <rect x="42" y="264" width="60" height="40" rx="6"/>
    <rect x="378" y="264" width="60" height="40" rx="6"/>
  </g>
  <g stroke="#8b5cf6" stroke-width="2">
    <path d="M44 86V92M60 86V92M76 86V92M44 126V132M60 126V132M76 126V132"/>
    <path d="M404 86V92M420 86V92M436 86V92M404 126V132M420 126V132M436 126V132"/>
