      <path d="M196 102V116M218 102V116M240 102V116M262 102V116M284 102V116"/>
      <path d="M196 236V250M218 236V250M240 236V250M262 236V250M284 236V250"/>
      <path d="M170 132H184M170 154H184M170 176H184M170 198H184M170 220H184"/>
      <path d="M296 132H310M296 154H310M296 176H310M296 198H310M296 220H310"/>
