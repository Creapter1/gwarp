    <path d="M480 144 H388 L356 176 H296"/>
    <path d="M0 198 H70 L102 166 H150"/>
    <path d="M480 198 H410 L378 166 H330"/>
    <path d="M240 0 V110"/>
    <path d="M240 242 V360"/>
    <path d="M64 360 V288 L112 240 H192"/>
    <path d="M416 360 V288 L368 240 H288"/>
