<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <defs>
    <linearGradient id="cbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.6" stop-color="#0b0b14"/>
      <stop offset="1" stop-color="#141425"/>
    </linearGradient>
    <radialGradient id="cbCoreGlow" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#4ade80" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0b0b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cbChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b31"/>
      <stop offset="1" stop-color="#0b0b14"/>
    </linearGradient>
  </defs>

  <!-- Night PCB Background -->
  <rect width="480" height="360" fill="url(#cbSky)"/>
  <rect width="480" height="360" fill="url(#cbCoreGlow)"/>

  <!-- Subtle Background Grid -->
