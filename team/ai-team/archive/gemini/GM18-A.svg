  <g id="look-scratch-toggle" transform="translate(128,42)">
    <rect width="24" height="24" rx="6" fill="#141425" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="4" y="8" width="16" height="8" rx="4" fill="#0b0b14" stroke="#8b5cf6" stroke-width="1.5"/>
